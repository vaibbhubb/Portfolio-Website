name: Update Analytics Data

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Analytics from GoatCounter
        env:
          GC_API_KEY: ${{ secrets.GC_API_KEY || '1ab2o72x3t05v1o6paujpmk4dz35uydxnh5o2n17237x1zebyfr' }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Fetching analytics up to $TODAY..."
          curl -s -H "Authorization: Bearer $GC_API_KEY" \
               -H "Content-Type: application/json" \
               "https://vaibbhubb.goatcounter.com/api/v0/stats/hits?start=2026-08-20&end=$TODAY&daily=true" \
               -o analytics/data.json
          
          # Validate json and create data.js
          if jq empty analytics/data.json > /dev/null 2>&1; then
            echo "Valid JSON received."
            echo -n "window.GOATCOUNTER_DATA = " > analytics/data.js
            cat analytics/data.json >> analytics/data.js
            echo ";" >> analytics/data.js
          else
            echo "Invalid JSON response, discarding."
            git checkout analytics/data.json analytics/data.js 2>/dev/null || true
            exit 0
          fi

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/data.json analytics/data.js
          if git diff --staged --quiet; then
            echo "No changes in analytics data."
          else
            git commit -m "chore: auto-update analytics data [skip ci]"
            git push
          fi
