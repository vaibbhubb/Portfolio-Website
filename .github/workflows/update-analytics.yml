name: Update Analytics Data

on:
  schedule:
    # Runs daily at 1:00 AM UTC (6:30 AM IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch fresh data from GoatCounter
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          # Bail out gracefully if the API key is missing (secrets can
          # intermittently fail to inject on scheduled runs).
          if [ -z "$GOATCOUNTER_API_KEY" ]; then
            echo "::warning::GOATCOUNTER_API_KEY secret is not set or empty – skipping this run."
            echo "SKIP_COMMIT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          START_DATE="2026-08-27"
          END_DATE=$(date +%Y-%m-%d)
          API_URL="https://vaibbhubb.goatcounter.com/api/v0/stats/hits?start=${START_DATE}&end=${END_DATE}&limit=100"

          echo "Fetching GoatCounter data..."
          echo "  Date range: ${START_DATE} -> ${END_DATE}"

          # Fetch with verbose error reporting
          HTTP_CODE=$(curl -s -o /tmp/gc_response.json -w "%{http_code}" \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Authorization: Bearer ${GOATCOUNTER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${API_URL}")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::GoatCounter API returned HTTP ${HTTP_CODE} – skipping update."
            echo "Response body:"
            cat /tmp/gc_response.json || true
            echo "SKIP_COMMIT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          RESPONSE=$(cat /tmp/gc_response.json)

          if [ -z "$RESPONSE" ]; then
            echo "::warning::Received empty response from GoatCounter API – skipping update."
            echo "SKIP_COMMIT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Validate JSON
          if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
            echo "::warning::GoatCounter API returned invalid JSON – skipping update."
            echo "Response body:"
            echo "$RESPONSE"
            echo "SKIP_COMMIT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Write data.json
          echo "$RESPONSE" | jq -c '.' > analytics/data.json
          echo "  Updated: analytics/data.json"

          # Write data.js (single-line, with trailing semicolon)
          printf 'window.GOATCOUNTER_DATA = %s;\n' "$(echo "$RESPONSE" | jq -c '.')" > analytics/data.js
          echo "  Updated: analytics/data.js"

          # Summary
          TOTAL=$(echo "$RESPONSE" | jq '.total')
          PAGES=$(echo "$RESPONSE" | jq '.hits | length')
          echo "Done! ${TOTAL} total views across ${PAGES} pages."

      - name: Commit and push if changed
        if: env.SKIP_COMMIT != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/data.js analytics/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update analytics data [skip ci]"
            git push
            echo "Changes committed and pushed."
          fi
