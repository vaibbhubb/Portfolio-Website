<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQVRH62J6C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VQVRH62J6C');
    </script>
    <script data-goatcounter="https://vaibbhubb.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Vaibbhubb</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .analytics-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        .analytics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .analytics-title h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .analytics-title h1 i {
            color: #00d2ff;
        }

        .analytics-title p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .analytics-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #00d2ff;
            border-radius: 50%;
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .btn-external {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-external:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: #00d2ff;
            color: #00d2ff;
            transform: translateY(-1px);
        }

        .iframe-container {
            width: 100%;
            height: 82vh;
            min-height: 650px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #151515;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            .analytics-wrapper {
                padding: 15px 16px 40px;
            }

            .analytics-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .iframe-container {
                height: 75vh;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="../" class="logo">vaibbhubb<span>.in</span></a>
    </nav>

    <div class="analytics-wrapper">
        <div class="analytics-header">
            <div class="analytics-title">
                <h1><i class="fa-solid fa-chart-line"></i> Analytics & Traffic</h1>
                <p>Real-time page views, visitors, and referrers across vaibbhubb.in</p>
            </div>
            <div class="analytics-actions">
                <div class="live-badge">
                    <span class="live-dot"></span> Live
                </div>
                <a href="https://vaibbhubb.goatcounter.com" target="_blank" rel="noopener noreferrer" class="btn-external">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Full View
                </a>
            </div>
        </div>

        <div class="iframe-container">
            <iframe 
                src="https://vaibbhubb.goatcounter.com?hideui=1" 
                title="Vaibbhubb Analytics Dashboard"
                loading="lazy">
            </iframe>
        </div>
    </div>

</body>

</html>
